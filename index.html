<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobMitra Assam - Assam No 1 Job Website</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f2f2f2;padding-bottom:85px}
.header{background:#0d47a1;color:#fff;padding:15px;text-align:center;position:sticky;top:0;z-index:10}
.header h2{font-size:18px;line-height:1.3}
.jobs{max-width:600px;margin:auto;padding:10px}
.job-card{background:#fff;padding:14px;border-radius:12px;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.08);display:flex;justify-content:space-between;align-items:center}
.job-card h4{font-size:14px;margin-bottom:3px}
.job-card p{font-size:11px;color:#666}
.apply-btn{background:#25D366;color:#fff;padding:8px 14px;border-radius:20px;text-decoration:none;font-size:13px;font-weight:bold}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px;box-shadow:0 -2px 10px rgba(0,0,0,.1)}
.bottom a{text-decoration:none;color:#222;font-size:13px;text-align:center;font-weight:bold}
</style>
</head>
<body>

<div class="header">
<h2>JobMitra Assam<br>Assam No 1 Job Website</h2>
<p style="font-size:11px;margin-top:4px">99 Free Jobs | Direct WhatsApp Apply</p>
</div>

<div class="jobs" id="jobsList"></div>

<div class="bottom">
<a href="index.html">🏠<br>Home</a>
<a href="refer.html">🎁<br>Refer</a>
<a href="https://wa.me/916901964052">💬<br>Help</a>
</div>

<script>
const WA_NUMBER = "916901964052";
let refCode = new URLSearchParams(window.location.search).get('ref') || localStorage.getItem('lastRef') || "JM7157";
localStorage.setItem('lastRef', refCode);

const jobs = [];
for(let i=1;i<=99;i++){
  jobs.push({
    name: `Job ${i} - Private Company Assam`,
    loc: ["Karimganj","Silchar","Nilambazar","Badarpur","Panchgram","Hailakandi","Assam"][i%7],
    salary: "₹10k - 18k"
  });
}
// Top 5 real jobs
jobs[0]={name:"Security Guard - Karimganj",loc:"Karimganj",salary:"₹12k-15k"};
jobs[1]={name:"Driver Job - Silchar",loc:"Silchar",salary:"₹15k-18k"};
jobs[2]={name:"Delivery Boy - Nilambazar",loc:"Nilambazar",salary:"₹12k-14k"};
jobs[3]={name:"Sales Girl - Badarpur Showroom",loc:"Badarpur",salary:"₹10k-12k"};
jobs[4]={name:"Computer Operator - Karimganj",loc:"Karimganj",salary:"₹14k"};

const list = document.getElementById('jobsList');
jobs.forEach((j,idx)=>{
  let msg = `Hello Sir, mujhe ${j.name} chahiye. Location: ${j.loc}. Mera Refer Code: ${refCode}. JobMitra Assam No 1 Website se dekha.`;
  let link = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
  list.innerHTML += `<div class="job-card"><div><h4>${idx+1}. ${j.name}</h4><p>📍 ${j.loc} | ${j.salary} | Ref: ${refCode}</p></div><a class="apply-btn" href="${link}" target="_blank">Apply</a></div>`;
});
</script>

</body>
</html>
